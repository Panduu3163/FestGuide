# Mock fest FAQ (source_type: mock). Indexed next to the rulebooks in M1.
faq:
  - q: Where do I pay the registration fee?
    a: Debate fees go through bKash as the Debate rulebook says; other events are paid at the registration desk.
  - q: Where can I get help on fest day?
    a: Visit the help desk at the CSE building entrance or write to the organizers.
  - q: Is there a certificate for participants?
    a: Participation certificates are planned for every registered participant.
  - q: Can I change my team after registering?
    a: Ask an organizer. The Debate rulebook allows no changes; other rulebooks do not say.
  - q: Is lunch provided?
    a: Light refreshments are planned for participants; this is mock information.
  - q: What should I bring on the day?
    a: A valid IIUC student ID card, and anything your event's rulebook lists.
