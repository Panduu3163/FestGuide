# Render blueprint: a free Docker web service. Secrets are typed into the Render dashboard, not stored here.
services:
  - type: web
    name: festguide
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
